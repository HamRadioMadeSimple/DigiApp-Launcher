# Making a tag like v1.3.3 (on the Releases page) builds the Windows Setup.exe and portable zip and the
# Linux .tar.gz, then attaches them to that release. (Actions > Release > Run workflow also builds them
# for testing, without a release.)
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup (for the installer)
        run: choco install innosetup -y --no-progress
      - name: Build the Setup.exe and the portable zip
        shell: cmd
        run: build_windows.bat
      - name: Check both files were made
        shell: bash
        run: ls -l output/DigiAppLauncher-*-Setup.exe output/DigiApp-Launcher-*-Windows-Portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            output/DigiAppLauncher-*-Setup.exe
            output/DigiApp-Launcher-*-Windows-Portable.zip

  linux:
    # Built on Ubuntu 22.04 (Mint 21). The download is plain Python, so it also runs on older and newer Linux.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tk for Python (for the self-tests)
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: Build the .tar.gz
        run: bash build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: output/DigiApp-Launcher-*-Linux.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Check the tag matches the version in digiapp/__init__.py
        run: |
          V="${GITHUB_REF_NAME#v}"
          grep -q "^__version__ = '$V'" digiapp/__init__.py || { echo "Tag $GITHUB_REF_NAME but digiapp/__init__.py says otherwise"; exit 1; }
      - name: Release notes from CHANGELOG.md (the section for this version)
        run: |
          V="${GITHUB_REF_NAME#v}"
          R="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          awk -v v="$V" '/^## /{if (f) exit; f=($2==v)} f' CHANGELOG.md | tail -n +2 > body.md
          {
            echo "## Downloads"
            echo ""
            echo "| System | File | How to install |"
            echo "|---|---|---|"
            echo "| Windows 10/11 | \`DigiAppLauncher-$V-Setup.exe\` | Run it. Updating keeps your profiles. |"
            echo "| Windows (no install) | \`DigiApp-Launcher-$V-Windows-Portable.zip\` | Unzip and run \`DigiAppLauncher.exe\`. |"
            echo "| Linux | \`DigiApp-Launcher-$V-Linux.tar.gz\` | Save it in Downloads and follow [Installing DigiApp Launcher on Linux]($R/blob/main/docs/Installing_DigiApp_Launcher_on_Linux.pdf) (three pasted lines). |"
            echo ""
            echo "If Windows says \"Windows protected your PC\", click **More info > Run anyway**. The program isn't code-signed."
            echo ""
            echo "Full guide: [DigiApp-Launcher-Guide.pdf]($R/blob/main/docs/DigiApp-Launcher-Guide.pdf) (also inside every download)."
            echo ""
            echo "## What's new"
            echo ""
            cat body.md
            echo ""
            echo "---"
            echo "Problems or ideas: please open an [issue]($R/issues). Full history: [CHANGELOG.md]($R/blob/main/CHANGELOG.md)."
          } > notes.md
          cat notes.md
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: DigiApp Launcher ${{ github.ref_name }}
          body_path: notes.md
          make_latest: true
          files: |
            out/windows/DigiAppLauncher-*-Setup.exe
            out/windows/DigiApp-Launcher-*-Windows-Portable.zip
            out/linux/DigiApp-Launcher-*-Linux.tar.gz
